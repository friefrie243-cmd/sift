<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sift - Lua Deobfuscation & Reverse Engineering Engine</title>
    <meta name="description" content="Sift Engine — Premium Lua deobfuscation, reverse engineering, and AI-powered variable renaming tool. Supports Moonsec, Luraph, IronBrew, Prometheus, and more.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0b0813;
            --panel-bg: rgba(22, 17, 38, 0.7);
            --border-color: rgba(187, 134, 252, 0.15);
            --primary: #9d4edd;
            --primary-glow: rgba(157, 78, 221, 0.4);
            --secondary: #c77dff;
            --text-color: #f1ecf9;
            --text-muted: #a594bd;
            --success: #38b000;
            --error: #d90429;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            background-image: radial-gradient(circle at 10% 20%, rgba(90, 24, 154, 0.15) 0%, transparent 40%),
                              radial-gradient(circle at 90% 80%, rgba(60, 9, 108, 0.15) 0%, transparent 40%);
            color: var(--text-color);
            font-family: 'Outfit', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 24px 40px;
            border-bottom: 1px solid var(--border-color);
            backdrop-filter: blur(10px);
            background: rgba(11, 8, 19, 0.5);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-size: 28px;
            font-weight: 800;
            color: var(--text-color);
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo span {
            background: linear-gradient(135deg, var(--secondary), var(--primary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .nav-links {
            display: flex;
            gap: 20px;
        }

        .nav-links a {
            color: var(--text-muted);
            text-decoration: none;
            font-weight: 600;
            transition: color 0.3s;
        }

        .nav-links a:hover {
            color: var(--secondary);
        }

        .container {
            max-width: 1600px;
            width: 100%;
            margin: 40px auto;
            padding: 0 40px;
            flex-grow: 1;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
        }

        @media (max-width: 1024px) {
            .container {
                grid-template-columns: 1fr;
            }
        }

        .panel {
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            backdrop-filter: blur(8px);
            position: relative;
            min-width: 0;
            overflow: hidden;
        }

        .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
        }

        .panel-title {
            font-size: 20px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .controls {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            align-items: center;
        }

        .toggle-container {
            display: flex;
            align-items: center;
            gap: 8px;
            user-select: none;
            cursor: pointer;
            font-size: 14px;
            color: var(--text-muted);
        }

        .toggle-container input {
            cursor: pointer;
            accent-color: var(--primary);
            width: 16px;
            height: 16px;
        }

        select, button, input[type="text"], input[type="password"] {
            background: rgba(36, 28, 59, 0.6);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 10px 16px;
            border-radius: 8px;
            font-family: inherit;
            font-size: 14px;
            outline: none;
            transition: all 0.3s;
        }

        select:focus, input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 8px var(--primary-glow);
        }

        button {
            cursor: pointer;
            font-weight: 600;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            border: none;
            white-space: nowrap;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px var(--primary-glow);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        button.secondary-btn {
            background: rgba(36, 28, 59, 0.8);
            border: 1px solid var(--border-color);
        }

        button.secondary-btn:hover {
            border-color: var(--primary);
            background: rgba(50, 38, 80, 0.8);
        }

        button.success-btn {
            background: linear-gradient(135deg, #2d6a4f, #38b000);
        }

        .input-methods {
            display: flex;
            gap: 8px;
            align-items: center;
            flex-wrap: wrap;
        }

        .file-upload-label {
            cursor: pointer;
            background: rgba(36, 28, 59, 0.8);
            border: 1px solid var(--border-color);
            padding: 10px 16px;
            border-radius: 8px;
            font-size: 14px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s;
        }

        .file-upload-label:hover {
            border-color: var(--primary);
            background: rgba(50, 38, 80, 0.8);
        }

        .file-upload-label input {
            display: none;
        }

        .file-name-display {
            font-size: 14px;
            color: var(--text-muted);
            max-width: 200px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .url-input-row {
            display: flex;
            gap: 8px;
            width: 100%;
        }

        .url-input-row input {
            flex-grow: 1;
        }

        .editor-container {
            flex-grow: 1;
            min-height: 350px;
            position: relative;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid var(--border-color);
        }

        .editor-container textarea {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            background: #090610;
            color: #d1c8e2;
            border: none;
            padding: 16px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 14px;
            line-height: 1.6;
            resize: none;
            outline: none;
        }

        .console-panel {
            background: #05040a;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 12px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 12px;
            color: #38b000;
            max-height: 180px;
            overflow-y: auto;
            white-space: pre-wrap;
            box-shadow: inset 0 2px 8px rgba(0,0,0,0.8);
            line-height: 1.5;
        }

        /* ─── Accordion Output Styles ─── */
        .accordion-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 8px;
        }

        .accordion-item {
            border: 1px solid var(--border-color);
            border-radius: 10px;
            overflow: hidden;
            background: rgba(22, 17, 38, 0.4);
            transition: all 0.3s;
        }

        .accordion-item.active {
            border-color: var(--primary);
            box-shadow: 0 4px 12px rgba(157, 78, 221, 0.15);
        }

        .accordion-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 18px;
            background: rgba(30, 23, 51, 0.7);
            cursor: pointer;
            user-select: none;
            font-weight: 600;
            font-size: 15px;
            color: var(--text-color);
            transition: background 0.3s;
        }

        .accordion-header:hover {
            background: rgba(43, 33, 74, 0.7);
        }

        .accordion-title {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .accordion-icon {
            font-size: 12px;
            transition: transform 0.3s ease;
            color: var(--secondary);
        }

        .accordion-item.active .accordion-icon {
            transform: rotate(90deg);
        }

        .accordion-actions {
            display: flex;
            gap: 8px;
        }

        .accordion-actions button {
            padding: 6px 12px;
            font-size: 12px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            background: rgba(36, 28, 59, 0.8);
        }

        .accordion-actions button:hover {
            border-color: var(--primary);
            background: rgba(50, 38, 80, 0.8);
            transform: none;
            box-shadow: none;
        }

        .accordion-content {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.35s ease-out;
            background: #090610;
        }

        .accordion-item.active .accordion-content {
            max-height: 600px;
        }

        .accordion-textarea {
            width: 100%;
            height: 380px;
            background: transparent;
            color: #d1c8e2;
            border: none;
            padding: 14px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 13.5px;
            line-height: 1.5;
            resize: none;
            outline: none;
            overflow-y: auto;
        }

        footer {
            text-align: center;
            padding: 30px;
            border-top: 1px solid var(--border-color);
            color: var(--text-muted);
            font-size: 14px;
        }

        /* Status indicator */
        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            display: inline-block;
            margin-right: 6px;
            animation: pulse 2s infinite;
        }
        .status-dot.online { background: var(--success); }
        .status-dot.processing { background: #f77f00; }
        .status-dot.error { background: var(--error); }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        /* Drag & drop overlay */
        .drop-overlay {
            display: none;
            position: absolute;
            inset: 0;
            background: rgba(157, 78, 221, 0.15);
            border: 2px dashed var(--primary);
            border-radius: 16px;
            z-index: 10;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            font-weight: 600;
            color: var(--secondary);
            pointer-events: none;
        }

        .panel.dragover .drop-overlay {
            display: flex;
        }

        /* Toast notification */
        .toast {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: rgba(22, 17, 38, 0.95);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 14px 20px;
            color: var(--text-color);
            font-size: 14px;
            z-index: 1000;
            transform: translateY(100px);
            opacity: 0;
            transition: all 0.4s ease;
            backdrop-filter: blur(10px);
            max-width: 400px;
        }
        .toast.show {
            transform: translateY(0);
            opacity: 1;
        }
    </style>
</head>
<body>
    <header>
        <div class="logo">
            SIFT <span>ENGINE</span>
        </div>
        <div class="nav-links">
            <a href="https://sift.win" target="_blank">Website</a>
            <a href="/docs">API docs</a>
        </div>
    </header>

    <div class="container">
        <!-- Input Panel -->
        <div class="panel" id="input-panel">
            <div class="drop-overlay">📁 Drop .lua or .txt file here</div>
            <div class="panel-header">
                <div class="panel-title">Input Script</div>
                <div class="controls">
                    <label class="toggle-container">
                        <input type="checkbox" id="all-outputs-toggle">
                        Multi-Engine Mode
                    </label>
                    <label class="toggle-container">
                        <input type="checkbox" id="include-loggers-toggle">
                        Include Trace Loggers
                    </label>
                    <select id="mode">
                        <option value="auto">Auto Detect</option>
                        <option value="IronBrew">IronBrew</option>
                        <option value="Luraph">Luraph</option>
                        <option value="Moonsec">Moonsec</option>
                        <option value="Prometheus">Prometheus</option>
                        <option value="Bytecode">Bytecode</option>
                    </select>
                    <button id="deobf-btn" onclick="runDeobf()">Deobfuscate</button>
                </div>
            </div>

            <!-- URL Input -->
            <div class="url-input-row">
                <input type="text" id="url-input" placeholder="Paste loadstring URL, raw GitHub link, or Pastebin link...">
                <button class="secondary-btn" id="fetch-btn" onclick="fetchFromUrl()">⬇ Fetch & Deobf</button>
            </div>

            <!-- File Upload -->
            <div class="input-methods">
                <label class="file-upload-label" id="file-upload-area">
                    📁 Upload .lua / .txt
                    <input type="file" id="file-input" accept=".lua,.txt,.luau" onchange="handleFileSelect(event)">
                </label>
                <span class="file-name-display" id="file-name-display"></span>
            </div>

            <div class="editor-container">
                <textarea id="input-code" placeholder="Paste your obfuscated Lua script here, or use URL / file upload above..."></textarea>
            </div>
        </div>

        <!-- Output Panel -->
        <div class="panel">
            <div class="panel-header">
                <div class="panel-title"><span class="status-dot online" id="status-dot"></span>Output Code</div>
                <div class="output-actions">
                    <button class="success-btn" id="download-btn" onclick="downloadOutput()" disabled>⬇ Download Best .lua</button>
                </div>
            </div>

            <!-- AI Rename controls -->
            <div class="controls">
                <select id="ai-provider">
                    <option value="vercel">Free Renamer (Vercel API)</option>
                    <option value="openai">OpenAI API</option>
                    <option value="ollama">Local Ollama</option>
                </select>
                <input type="password" id="api-key" placeholder="AI API Key (Optional)">
                <button id="rename-btn" onclick="runRename()">✨ AI Rename</button>
            </div>

            <!-- Accordion container for multi-engine outputs -->
            <div class="accordion-container" id="accordion-container" style="display: none;">
                <!-- Dynamically populated accordions will appear here -->
            </div>

            <!-- Single output editor container -->
            <div class="editor-container" id="single-output-container">
                <textarea id="output-code" readonly placeholder="Resulting code will appear here..."></textarea>
            </div>

            <div class="panel-title">Execution Logs</div>
            <div class="console-panel" id="console-logs">System initialized. Ready for operations.</div>
        </div>
    </div>

    <footer>
        &copy; 2026 Sift Reverse Engineering. Provided for reverse engineering and educational study.
    </footer>

    <div class="toast" id="toast"></div>

    <script>
        let currentJobId = null;
        let multiEngineOutputs = [];

        function log(message) {
            const consoleBox = document.getElementById("console-logs");
            consoleBox.textContent += "\n" + message;
            consoleBox.scrollTop = consoleBox.scrollHeight;
        }

        function showToast(message, duration = 3000) {
            const toast = document.getElementById("toast");
            toast.textContent = message;
            toast.classList.add("show");
            setTimeout(() => toast.classList.remove("show"), duration);
        }

        function setStatus(state) {
            const dot = document.getElementById("status-dot");
            dot.className = "status-dot " + state;
        }

        function enableDownload(jobId) {
            currentJobId = jobId;
            const btn = document.getElementById("download-btn");
            btn.disabled = !jobId;
        }

        // ─── Accordion Rendering & Management ───
        function renderAccordions(outputs) {
            const container = document.getElementById("accordion-container");
            const singleContainer = document.getElementById("single-output-container");
            
            container.innerHTML = "";
            multiEngineOutputs = outputs || [];

            if (multiEngineOutputs.length === 0) {
                container.style.display = "none";
                singleContainer.style.display = "block";
                return;
            }

            // Hide standard single textbox, show accordion container
            container.style.display = "flex";
            singleContainer.style.display = "none";

            multiEngineOutputs.forEach((out, idx) => {
                const item = document.createElement("div");
                item.className = "accordion-item" + (idx === 0 ? " active" : "");
                item.id = `accordion-item-${idx}`;

                const header = document.createElement("div");
                header.className = "accordion-header";
                header.onclick = () => toggleAccordion(idx);

                const title = document.createElement("div");
                title.className = "accordion-title";
                title.innerHTML = `<span class="accordion-icon">▶</span> <span>${out.name} Output</span>`;

                const actions = document.createElement("div");
                actions.className = "accordion-actions";
                
                const copyBtn = document.createElement("button");
                copyBtn.textContent = "Copy";
                copyBtn.onclick = (e) => {
                    e.stopPropagation();
                    copyText(out.output_code);
                };

                const saveBtn = document.createElement("button");
                saveBtn.textContent = "Download";
                saveBtn.onclick = (e) => {
                    e.stopPropagation();
                    saveTextAsFile(out.output_code, `sift_${out.name.replace(/\s+/g, "_").toLowerCase()}.lua`);
                };

                actions.appendChild(copyBtn);
                actions.appendChild(saveBtn);
                header.appendChild(title);
                header.appendChild(actions);

                const content = document.createElement("div");
                content.className = "accordion-content";

                const txt = document.createElement("textarea");
                txt.className = "accordion-textarea";
                txt.readOnly = true;
                txt.value = out.output_code;

                content.appendChild(txt);
                item.appendChild(header);
                item.appendChild(content);
                container.appendChild(item);
            });

            // Set the main output textbox value to the best (longest) one so AI Rename still works
            if (multiEngineOutputs.length > 0) {
                document.getElementById("output-code").value = multiEngineOutputs[0].output_code;
            }
        }

        function toggleAccordion(index) {
            const item = document.getElementById(`accordion-item-${index}`);
            const isActive = item.classList.contains("active");
            
            // Deactivate all others
            document.querySelectorAll(".accordion-item").forEach(el => el.classList.remove("active"));
            
            if (!isActive) {
                item.classList.add("active");
                // Synchronize active code block for AI renaming
                document.getElementById("output-code").value = multiEngineOutputs[index].output_code;
            }
        }

        function copyText(text) {
            navigator.clipboard.writeText(text).then(() => {
                showToast("Copied to clipboard!");
            }).catch(() => {
                showToast("Failed to copy code.");
            });
        }

        function saveTextAsFile(text, filename) {
            const blob = new Blob([text], { type: "text/plain" });
            const url = URL.createObjectURL(blob);
            const a = document.createElement("a");
            a.href = url;
            a.download = filename;
            a.click();
            URL.revokeObjectURL(url);
            showToast("Download started!");
        }

        // ─── File Upload ───
        function handleFileSelect(event) {
            const file = event.target.files[0];
            if (!file) return;
            const display = document.getElementById("file-name-display");
            display.textContent = file.name;

            const reader = new FileReader();
            reader.onload = function(e) {
                document.getElementById("input-code").value = e.target.result;
                showToast(`Loaded ${file.name} (${(file.size / 1024).toFixed(1)} KB)`);
            };
            reader.readAsText(file);
        }

        // ─── Drag & Drop ───
        const inputPanel = document.getElementById("input-panel");
        inputPanel.addEventListener("dragover", (e) => {
            e.preventDefault();
            inputPanel.classList.add("dragover");
        });
        inputPanel.addEventListener("dragleave", () => {
            inputPanel.classList.remove("dragover");
        });
        inputPanel.addEventListener("drop", (e) => {
            e.preventDefault();
            inputPanel.classList.remove("dragover");
            const file = e.dataTransfer.files[0];
            if (file) {
                const ext = file.name.split('.').pop().toLowerCase();
                if (!["lua", "txt", "luau"].includes(ext)) {
                    showToast("Unsupported file type. Please use .lua, .txt, or .luau");
                    return;
                }
                document.getElementById("file-name-display").textContent = file.name;
                const reader = new FileReader();
                reader.onload = function(ev) {
                    document.getElementById("input-code").value = ev.target.result;
                    showToast(`Dropped ${file.name} (${(file.size / 1024).toFixed(1)} KB)`);
                };
                reader.readAsText(file);
            }
        });

        // ─── Fetch from URL ───
        async function fetchFromUrl() {
            const url = document.getElementById("url-input").value.trim();
            const mode = document.getElementById("mode").value;
            const allOutputs = document.getElementById("all-outputs-toggle").checked;
            const btn = document.getElementById("fetch-btn");

            if (!url) {
                showToast("Please paste a URL first!");
                return;
            }

            btn.disabled = true;
            btn.textContent = "Fetching...";
            setStatus("processing");
            log(`[*] Fetching and deobfuscating from URL: ${url}`);

            try {
                const response = await fetch("/api/deobf-url", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ url, mode, all_outputs: allOutputs })
                });
                const data = await response.json();

                if (data.success) {
                    document.getElementById("output-code").value = data.output_code;
                    log(data.console_log);
                    log("[+] Deobfuscation from URL complete!");
                    setStatus("online");
                    enableDownload(data.job_id);
                    
                    if (allOutputs && data.all_outputs && data.all_outputs.length > 0) {
                        renderAccordions(data.all_outputs);
                    } else {
                        renderAccordions([]);
                    }
                    
                    showToast("Deobfuscation complete!");
                } else {
                    log("[!] URL fetch or deobfuscation failed.");
                    log(data.console_log);
                    setStatus("error");
                }
            } catch (err) {
                log("[!] Communication error: " + err.message);
                setStatus("error");
            } finally {
                btn.disabled = false;
                btn.textContent = "⬇ Fetch & Deobf";
            }
        }

        // ─── Deobfuscate (paste) ───
        async function runDeobf() {
            const code = document.getElementById("input-code").value;
            const mode = document.getElementById("mode").value;
            const allOutputs = document.getElementById("all-outputs-toggle").checked;
            const btn = document.getElementById("deobf-btn");
            const fileInput = document.getElementById("file-input");

            if (!code.trim() && !fileInput.files.length) {
                showToast("Please paste some script, upload a file, or use a URL!");
                return;
            }

            btn.disabled = true;
            btn.textContent = "Processing...";
            setStatus("processing");
            log("[*] Sending code to Sift engine...");

            try {
                let response;

                // If a file is selected and textarea is from that file, use upload endpoint
                if (fileInput.files.length > 0) {
                    const formData = new FormData();
                    formData.append("file", fileInput.files[0]);
                    formData.append("mode", mode);
                    formData.append("all_outputs", allOutputs);
                    response = await fetch("/api/deobf-upload", {
                        method: "POST",
                        body: formData
                    });
                } else {
                    response = await fetch("/api/deobf", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ code, mode, all_outputs: allOutputs })
                    });
                }

                const data = await response.json();

                if (data.success) {
                    document.getElementById("output-code").value = data.output_code;
                    log(data.console_log);
                    log("[+] Deobfuscation complete!");
                    setStatus("online");
                    enableDownload(data.job_id);
                    
                    if (allOutputs && data.all_outputs && data.all_outputs.length > 0) {
                        renderAccordions(data.all_outputs);
                    } else {
                        renderAccordions([]);
                    }
                    
                    showToast("Deobfuscation complete!");
                } else {
                    log("[!] Sift Engine returned an error.");
                    log(data.console_log || "Unknown error");
                    setStatus("error");
                }
            } catch (err) {
                log("[!] Communication error with Sift backend: " + err.message);
                setStatus("error");
            } finally {
                btn.disabled = false;
                btn.textContent = "Deobfuscate";
                // Clear file input so next click uses textarea
                fileInput.value = "";
                document.getElementById("file-name-display").textContent = "";
            }
        }

        // ─── AI Rename ───
        async function runRename() {
            const code = document.getElementById("output-code").value;
            const provider = document.getElementById("ai-provider").value;
            const apiKey = document.getElementById("api-key").value;
            const btn = document.getElementById("rename-btn");

            if (!code.trim()) {
                showToast("No output code to rename! Run deobfuscate first.");
                return;
            }

            btn.disabled = true;
            btn.textContent = "AI Renaming...";
            log("[*] Sending code to LLM for variable renaming...");

            try {
                const response = await fetch("/api/rename", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ code, provider, api_key: apiKey })
                });
                const data = await response.json();

                if (data.success) {
                    document.getElementById("output-code").value = data.renamed_code;
                    
                    // If accordions are active, update the currently selected accordion's textbox too
                    const activeItem = document.querySelector(".accordion-item.active");
                    if (activeItem) {
                        const idx = parseInt(activeItem.id.split("-").pop());
                        activeItem.querySelector(".accordion-textarea").value = data.renamed_code;
                        if (multiEngineOutputs[idx]) {
                            multiEngineOutputs[idx].output_code = data.renamed_code;
                        }
                    }
                    
                    log("[+] Variables renamed successfully!");
                    showToast("AI Rename complete!");
                } else {
                    log("[!] Variable renaming failed.");
                    log(data.renamed_code);
                }
            } catch (err) {
                log("[!] Communication error with Sift AI agent: " + err.message);
            } finally {
                btn.disabled = false;
                btn.textContent = "✨ AI Rename";
            }
        }

        // ─── Download Output ───
        function downloadOutput() {
            if (currentJobId) {
                // Use the server download endpoint
                window.open(`/api/download/${currentJobId}`, '_blank');
                showToast("Download started!");
            } else {
                // Fallback: download from textarea
                const code = document.getElementById("output-code").value;
                if (!code.trim()) {
                    showToast("No output to download!");
                    return;
                }
                saveTextAsFile(code, "sift_output.lua");
            }
        }

        // Allow Enter key in URL input to trigger fetch
        document.getElementById("url-input").addEventListener("keydown", (e) => {
            if (e.key === "Enter") {
                e.preventDefault();
                fetchFromUrl();
            }
        });
    </script>
</body>
</html>
